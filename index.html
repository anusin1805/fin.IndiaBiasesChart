<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Mandala - Interpretive Visualization</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050e1e;color:#c9a86a;font-family: Inter, sans-serif; display:flex; flex-direction:column; align-items:center;}
  .notice{
    width:90%; max-width:1000px; margin:20px auto; padding:10px 16px;
    background: linear-gradient(90deg,#d4af37,#f1d27a); color:#000; 
    border-radius:8px; font-size:12px; letter-spacing:0.5px;
  }
  .notice span{opacity:0.7}
  .mandala-container{
    position:relative; width:90vmin; height:90vmin; max-width:800px; max-height:800px;
    margin:20px auto;
  }
  .layer{
    position:absolute; top:0; left:0; width:100%; height:100%;
    border-radius:50%; transform-origin:center center;
  }
  /* RINGS */
  .ring{border:1px solid rgba(201,168,106,0.25);}
  .ring::after{
    content:attr(data-label); position:absolute; font-size:9px;
    color:#c9a86a; letter-spacing:1px;
  }

  /* CORE */
  #core{
    width:12%; height:12%; top:44%; left:44%;
    background:radial-gradient(circle,#1a2a4a,#0a1628);
    border:1px solid #c9a86a; display:flex; align-items:center; justify-content:center;
    font-size:8px; text-align:center; line-height:1.1;
  }

  /* ANIMATIONS - each layer different speed */
  .rotate-slow{animation:rot 180s linear infinite}
  .rotate-mid{animation:rot 120s linear infinite}
  .rotate-fast{animation:rot 60s linear infinite}
  .rotate-rev{animation:rotRev 150s linear infinite}
  @keyframes rot{from{rotate:0deg} to{rotate:360deg}}
  @keyframes rotRev{from{rotate:360deg} to{rotate:0deg}}

  /* TICK MARKS */
  .ticks{
    background: repeating-conic-gradient(from 0deg, transparent 0 1.2deg, rgba(201,168,106,0.3) 1.2deg 1.4deg);
    mask: radial-gradient(circle, transparent 96%, black 97%);
  }

  /* ENERGY YIN YANG */
  #energy{
    background: conic-gradient(from 0deg, #f1d27a 0 180deg, #0a1628 180deg 360deg);
    mask: radial-gradient(circle, transparent 68%, black 69% 73%, transparent 74%);
    opacity:0.6;
  }
  #energy::before{
    content:''; position:absolute; width:32%; height:32%; border-radius:50%;
    background:#0a1628; top:34%; left:18%; box-shadow: 0 0 0 1px #c9a86a;
  }

  /* LABELS POSITIONING */
  .label{
    position:absolute; font-size:7px; text-transform:uppercase; transform: translate(-50%,-50%);
    white-space:nowrap; color:#e8d5a3;
  }
</style>
</head>
<body>

<div class="notice">✦ This is an interpretive visualisation, not a factual astrological claim.</div>

<div class="mandala-container" id="mandala">
  <!-- LAYER 9 - 365 DAYS OUTER -->
  <div class="layer ticks rotate-slow" style="width:100%;height:100%"></div>

  <!-- LAYER 8 - COUNTRIES EAST WEST + MONTHS -->
  <div class="layer ring" style="width:92%;height:92%;top:4%;left:4%" id="months"></div>

  <!-- LAYER 7 - POPULATION -->
  <div class="layer ring" style="width:82%;height:82%;top:9%;left:9%" id="pop"></div>

  <!-- LAYER 6 - PLANETS -->
  <div class="layer ring" style="width:72%;height:72%;top:14%;left:14%" id="planets"></div>

  <!-- LAYER 5 - ENERGY -->
  <div class="layer rotate-rev" id="energy" style="width:62%;height:62%;top:19%;left:19%"></div>

  <!-- LAYER 4 - WEEKDAYS -->
  <div class="layer ring rotate-mid" style="width:52%;height:52%;top:24%;left:24%" id="week"></div>

  <!-- LAYER 3 - ELEMENTS -->
  <div class="layer ring" style="width:42%;height:42%;top:29%;left:29%" id="elements"></div>

  <!-- LAYER 2 - SEASONS -->
  <div class="layer ring rotate-slow" style="width:32%;height:32%;top:34%;left:34%" id="seasons"></div>

  <!-- LAYER 1 - GENERATIONS + CORE -->
  <div class="layer" id="core">CORE<br>Family<br>Religion<br>Israel</div>
</div>

<script>
// Draw labels dynamically so all share same center
const data = {
  months: ['JAN 1.5B India','FEB','MAR 1.5B China','APR Africa 1B','MAY MidEast 650M','JUN','JUL EastAsia 300M','AUG USA 330M','SEP','OCT UK 60M','NOV Italy 60M','DEC S.America'],
  pop: ['India','China','Africa','Middle East','Vietnam','USA','Canada','UK','Italy','Argentina'],
  planets: ['Saturn','Earth','Mercury','Venus','Moon','Jupiter','Uranus','Sun','Mars'],
  week: ['Mon Moon','Tue Mars','Wed Mercury','Thu Jupiter','Fri Venus','Sat Saturn','Sun Sun'],
  elements: ['Water','Air','Heat','Cold'],
  seasons: ['Winter Wheat','Summer Cotton','Rainy Rice','Spring Fruits','Autumn Pulses']
}

function placeRing(id, items, radius){
  const container = document.getElementById(id);
  const r = container.offsetWidth/2;
  items.forEach((txt,i)=>{
    const angle = (i/items.length)*360 - 90;
    const el = document.createElement('div');
    el.className='label';
    el.textContent=txt;
    const rad = angle*Math.PI/180;
    el.style.left = (50 + radius*Math.cos(rad)) + '%';
    el.style.top = (50 + radius*Math.sin(rad)) + '%';
    el.style.rotate = (angle+90)+'deg';
    container.appendChild(el);
  })
}

placeRing('months', data.months, 48);
placeRing('pop', data.pop, 46);
placeRing('planets', data.planets, 44);
placeRing('week', data.week, 42);
placeRing('elements', data.elements, 40);
placeRing('seasons', data.seasons, 38);

// make it responsive peel effect on click
document.querySelectorAll('.layer').forEach(l=>{
  l.addEventListener('click',()=>{l.style.scale = l.style.scale==='1.1' ? '1' : '1.1'});
})
</script>
</body>
</html>
